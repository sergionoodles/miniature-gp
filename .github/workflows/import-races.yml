name: Import current season races

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-races
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test importer
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Import available races
        id: import
        continue-on-error: true
        run: python scripts/import_races.py
      - name: Update catalogs from existing replays
        run: python scripts/import_races.py --catalog-only
      - name: Publish replay files and catalog
        run: |
          git add -- public/data
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import newly available races'
          git push
      - name: Report import errors
        if: steps.import.outcome == 'failure'
        run: exit 1
